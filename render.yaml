databases:
  - name: unruffled-feathers-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: unruffled-feathers-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run db:init
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: unruffled-feathers-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        sync: false
